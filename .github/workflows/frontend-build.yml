name: Frontend and security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static frontend
        run: npm run check:frontend
      - name: Run JavaScript unit tests
        run: npm test
      - name: Verify static deployment configuration
        run: npm run build

  deno-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - name: Test Edge Function security helpers
        run: deno test --allow-env supabase/functions/tests/security_test.ts

  supabase-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations to clean local database
        run: supabase db reset
      - name: Run pgTAP security tests
        run: supabase test db
