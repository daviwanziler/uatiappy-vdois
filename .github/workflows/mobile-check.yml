name: Mobile app checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  expo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install
      - name: Check Expo project
        run: npx expo-doctor
      - name: Export app bundles
        run: npx expo export --platform all
